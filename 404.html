<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — STAT6 × Design Hub Template</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--text:#0A0A08;--muted:#5E5D57;--coral:#F75A5A;--ink:#131209;--ease:cubic-bezier(0.32,0.72,0,1)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Geist,system-ui,sans-serif;text-align:center;padding:24px}
  .logos{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:48px}
  .logos .s6{height:28px;width:auto}
  .logos .x{font-family:"Instrument Serif",serif;font-style:italic;font-size:24px;color:#8E8C85}
  .dh{position:relative;display:inline-block;height:40px;width:98px;overflow:hidden}
  .dh img{position:absolute;max-width:none;width:110px;height:110px;left:-7px;top:-37px}
  .code{font-size:128px;line-height:1;font-weight:700;letter-spacing:-.06em;margin:0}
  .code em{font-family:"Instrument Serif",serif;font-weight:400;color:var(--coral)}
  h1{margin:16px 0 0;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
  p{margin:16px auto 0;max-width:420px;color:var(--muted);font-size:16px;line-height:24px;text-wrap:pretty}
  .note{font-family:Caveat,cursive;font-size:26px;color:var(--coral);transform:rotate(-3deg);margin-top:24px}
  a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:32px;padding:12px 24px;border-radius:999px;background:var(--text);color:#fff;font-weight:600;text-decoration:none;transition:background-color .6s var(--ease),transform .6s var(--ease)}
  a.btn:hover{background:var(--coral);transform:translateY(-2px)}
  a.btn:focus-visible{outline:2px solid var(--coral);outline-offset:4px}
</style>
</head>
<body>
  <main>
    <div class="logos">
      <img class="s6" src="/assets/stat6-logo.png" alt="STAT6">
      <span class="x" aria-hidden="true">×</span>
      <span class="dh"><img src="/assets/design-hub-logo.png" alt="Design Hub Template"></span>
    </div>
    <p class="code">4<em>0</em>4</p>
    <h1>This page took a different flight.</h1>

    <div class="note">Even our best routes need a detour sometimes.</div>
    <a class="btn" href="/">Back to the home page →</a>
  </main>
</body>
</html>
